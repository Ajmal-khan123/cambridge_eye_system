<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambridge Opticians | Patient & Doctor Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent: #0ea5e9;
            --accent-hover: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --whatsapp: #25D366;
            --gmail: #EA4335;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(14, 165, 233, 0.15), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.1), transparent 30%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Navigation */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav { display: flex; gap: 1.5rem; }

        .nav-link {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            background: var(--glass-bg);
            color: var(--accent);
        }

        .nav-link.doctor-btn {
            background: rgba(234, 67, 53, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(234, 67, 53, 0.3);
        }

        /* Page Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            flex-grow: 1;
            width: 100%;
        }

        .page-section {
            display: none;
            animation: slideUp 0.5s ease-out forwards;
        }
        .page-section.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism Elements */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        h2 { font-size: 2rem; margin-bottom: 1.5rem; color: var(--accent); }

        /* Forms */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.95rem; color: var(--text-muted); }

        input[type="text"], input[type="tel"], input[type="number"], select, textarea {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.3);
        }

        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .checkbox-label {
            display: flex; align-items: center; gap: 8px;
            background: rgba(0,0,0,0.2); padding: 10px;
            border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.3s;
        }
        .checkbox-label:hover { border-color: var(--glass-border); }

        /* Buttons */
        .btn {
            border: none; padding: 15px 30px; color: white;
            font-size: 1.1rem; border-radius: 30px; cursor: pointer;
